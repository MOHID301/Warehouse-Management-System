<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Products - UnSturcTure.Inc</title>
<link rel="stylesheet" href="CSS/style.css" />
</head>
<body>

  <div class="sidebar">
    <h2 class="brand-name">UnSturcTure<span class="brand-suffix">.Inc</span></h2>
    <p class="brand-tagline">Warehouse Management</p>
    <ul>
      <li><a href="index.html">Dashboard</a></li>
      <li><a class="active" href="products.html" style="font-weight:bold;">Products</a></li>
      <li><a href="warehouses.html">Warehouses</a></li>
      <li><a href="vendors.html">Vendors</a></li>
      <li><a href="inventory.html">Inventory</a></li>
      <li><a href="orders.html">Orders</a></li>
      
    </ul>
    <button class="logOut-Button" onclick="logout()">
      <script>
        function logout(){

    localStorage.clear();

    window.location.href =
        "login.html";}
      </script>
    Logout
   </button>
  </div>

  <div class="main">
    <div class="topbar">
      <h1>Products</h1>
    </div>

    <div class="section">
      <h2>Add / Edit Product</h2>
      <form id="product-form">
        <input type="hidden" id="product_id">
        <input type="text" id="product_name" placeholder="Product Name" required>
        <input type="text" id="category" placeholder="Category">
        <input type="number" id="unit_price" placeholder="Unit Price" min="0" step="0.01" required>
        <button type="submit" id="submit-btn">Add Product</button>
      </form>
    </div>

    <div class="section">
      <h2>All Products</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Unit Price</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="product-table-body"></tbody>
      </table>
    </div>

    <div class="footer">Warehouse Management System &mdash; Developed by Mohid & CO.</div>
      <div class="footer2">© 2026 UnStructure.Inc — All Rights Reserved</div>
  </div>

  <script src="Js/products.js"></script>
</body>
</html>

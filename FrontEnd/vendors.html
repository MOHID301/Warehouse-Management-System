<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vendors - UnSturcTure.Inc</title>
<link rel="stylesheet" href="CSS/style.css" />
</head>
<body>

  <div class="sidebar">
    <h2 class="brand-name">UnSturcTure<span class="brand-suffix">.Inc</span></h2>
    <p class="brand-tagline">Warehouse Management</p>
    <ul>
      <li><a href="index.html">Dashboard</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="warehouses.html">Warehouses</a></li>
      <li><a class="active" href="vendors.html" style="font-weight:bold;">Vendors</a></li>
      <li><a href="inventory.html">Inventory</a></li>
      <li><a href="orders.html">Orders</a></li>
      
    </ul>
    <button class="logOut-Button" onclick="logout()">
      <script>
        function logout(){

    localStorage.clear();

    window.location.href =
        "login.html";}
      </script>
    Logout
   </button>
  </div>

  <div class="main">
    <div class="topbar">
      <h1>Vendors</h1>
    </div>

    <div class="section">
      <h2>Add / Edit Vendor</h2>
      <form id="vendor-form">
        <input type="hidden" id="vendor_id">
        <input type="text" id="vendor_name" placeholder="Vendor Name" required>
        <input type="text" id="phone" placeholder="Phone">
        <input type="email" id="email" placeholder="Email">
        <button type="submit" id="submit-btn">Add Vendor</button>
      </form>
    </div>

    <div class="section">
      <h2>All Vendors</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="vendor-table-body"></tbody>
      </table>
    </div>

    <div class="footer">Warehouse Management System &mdash; Developed by Mohid & CO.</div>
      <div class="footer2">© 2026 UnStructure.Inc — All Rights Reserved</div>
  </div>
  <script src="Js/vendors.js"></script>
</body>
</html>
